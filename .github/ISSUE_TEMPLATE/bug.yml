name: Bug report
description: Report incorrect mock behavior or a contract mismatch.
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include a minimal test and the expected and actual behavior. Remove all credentials and private data.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: jev-msw, @typesafe-ai/sdk, MSW, Node.js
    validations:
      required: true
